<article
  class="group rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-md">
  <div class="flex items-start justify-between gap-4">

    <div>
      <p class="text-sm font-medium text-slate-500">
        {{ title }}
      </p>

      <p class="mt-2 text-3xl font-semibold tracking-tight text-slate-900">
        {{ value }}
      </p>
    </div>

    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100">
      <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
    </div>

  </div>

  <div class="mt-5 border-t border-slate-100 pt-4">
    <p class="text-xs font-medium text-slate-400">
      Resumen actualizado
    </p>
  </div>
</article>
